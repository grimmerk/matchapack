# Publishes matchapack to crates.io after a release.
#
# Called by release.yml (a dist "custom publish job", see dist-workspace.toml),
# never on its own; a pull request runs only release.yml's plan step.
#
# Authentication is crates.io trusted publishing: no stored token. crates.io
# matches the workflow filename of the top-level workflow in the OIDC token's
# workflow_ref, which is release.yml, so the crate's trusted publisher on
# crates.io names release.yml, not this file. crates.io lets a trusted
# publisher be set only for a crate that exists, so the first release
# publishes with the CARGO_REGISTRY_TOKEN secret (see RELEASING.md); once the
# trusted publisher is set, delete the secret and this job uses OIDC alone.
#
# A version that crates.io already has (200) is skipped and a missing one (404)
# is published, so a re-run after a partial failure publishes only what is
# missing; any other answer (an outage, a rate limit) stops the job.
name: Publish to crates.io

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Check crates.io
        id: check
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "matchapack") | .version')
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'User-Agent: matchapack-release (github.com/grimmerk/matchapack)' \
            "https://crates.io/api/v1/crates/matchapack/$version")
          case "$status" in
            200) echo "matchapack $version is already on crates.io; skipped"; echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            404) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "crates.io answered HTTP $status for matchapack $version; not publishing" >&2; exit 1 ;;
          esac
          if [ -n "${FIRST_TOKEN:-}" ]; then echo "token=secret" >> "$GITHUB_OUTPUT"; else echo "token=oidc" >> "$GITHUB_OUTPUT"; fi
        env:
          FIRST_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.check.outputs.publish == 'true' && steps.check.outputs.token == 'oidc'
        id: auth
      - name: Publish
        if: steps.check.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p matchapack --locked
