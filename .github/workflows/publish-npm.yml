# Publishes the npm package `matchapack` after a release: one package with
# the four binaries and a sh launcher, built by scripts/npm-packages.js from
# this run's archives, installed once from its tarball as a smoke test, then
# published from that same tarball.
#
# Called by release.yml (a dist "custom publish job", see dist-workspace.toml),
# never on its own; a pull request runs only release.yml's plan step.
#
# Authentication: npm trusted publishing (OIDC), with provenance (npm makes
# provenance only for a public repository). npm checks the CALLING workflow's
# filename, so the package's trusted publisher on npmjs.com names
# release.yml, not this file. A trusted publisher can be set only on a
# package that exists, so the first release publishes with the NPM_TOKEN
# secret (a short-lived granular token); RELEASING.md has the order.
#
# A version npm already has is skipped (200) and a missing one published
# (404), so a re-run after a failure is safe; any other answer stops the job.
name: Publish to npm

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PLAN: ${{ inputs.plan }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
      - name: Fetch the release's archives
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: archives/
          merge-multiple: true
      - name: Build the package
        run: |
          set -euo pipefail
          # Trusted publishing needs npm 11.5.1 or later.
          npm --version | awk -F. '{ if ($1 < 11 || ($1 == 11 && $2 < 5) || ($1 == 11 && $2 == 5 && $3 < 1)) { print "npm " $0 " is older than 11.5.1"; exit 1 } }'
          version=$(echo "$PLAN" | jq -r '.releases[] | select(.app_name == "matchapack") | .app_version')
          echo "VERSION=$version" >> "$GITHUB_ENV"
          node scripts/npm-packages.js --version "$version" --archives archives --out out
          npm pack ./out/matchapack --pack-destination .
          ls -l "matchapack-$version.tgz"
      - name: Smoke test (a global install from the tarball, scripts off)
        run: |
          set -euo pipefail
          prefix=$RUNNER_TEMP/smoke
          npm i -g "./matchapack-$VERSION.tgz" --ignore-scripts --prefix "$prefix" --cache "$RUNNER_TEMP/smoke-cache"
          out=$("$prefix/bin/matchapack" --version)
          echo "$out"
          case $out in "matchapack $VERSION ("*) ;; *) echo "expected matchapack $VERSION"; exit 1 ;; esac
      - name: Publish
        env:
          # Empty once the secret is deleted: npm then authenticates with OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # A prerelease must not become `latest` (dist skips this job for
          # prereleases unless publish-prereleases is set).
          case $VERSION in *-*) tag=next ;; *) tag=latest ;; esac
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/matchapack/$VERSION")
          case "$status" in
            200) echo "matchapack $VERSION is already on npm; skipped"; exit 0 ;;
            404) ;;
            *) echo "npm answered HTTP $status for matchapack $VERSION; not publishing" >&2; exit 1 ;;
          esac
          npm publish "./matchapack-$VERSION.tgz" --access public --provenance --tag "$tag"
