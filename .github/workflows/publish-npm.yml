# Publishes the npm packages after a release: the four platform packages
# (@matchapack/darwin-arm64, darwin-x64, linux-arm64, linux-x64), then
# `matchapack`, which depends on them (scripts/npm-packages.js builds them
# from this run's archives).
#
# Called by release.yml (a dist "custom publish job", see dist-workspace.toml),
# never on its own; a pull request runs only release.yml's plan step.
#
# Authentication: npm trusted publishing (OIDC), with provenance. npm checks
# the CALLING workflow's filename, so each package's trusted publisher on
# npmjs.com names release.yml, not this file. A package must exist before a
# trusted publisher can be set for it, so the first release publishes with
# the NPM_TOKEN secret (a short-lived granular token); once the trusted
# publishers are set, delete the secret and this job uses OIDC alone.
#
# A version npm already has is skipped (200) and a missing one published
# (404), so a re-run after a partial failure publishes only what is missing;
# any other answer stops the job.
name: Publish to npm

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PLAN: ${{ inputs.plan }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
      - name: Fetch the release's archives
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: archives/
          merge-multiple: true
      - name: Build the packages
        run: |
          set -euo pipefail
          # Trusted publishing needs npm 11.5.1 or later.
          npm --version | awk -F. '{ if ($1 < 11 || ($1 == 11 && $2 < 5) || ($1 == 11 && $2 == 5 && $3 < 1)) { print "npm " $0 " is older than 11.5.1"; exit 1 } }'
          version=$(echo "$PLAN" | jq -r '.releases[] | select(.app_name == "matchapack") | .app_version')
          node scripts/npm-packages.js --version "$version" --archives archives --out packages | tee packages.txt
      - name: Publish
        env:
          # Empty once the secret is deleted: npm then authenticates with OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version=$(echo "$PLAN" | jq -r '.releases[] | select(.app_name == "matchapack") | .app_version')
          # A prerelease must not become `latest` (dist skips this job for
          # prereleases unless publish-prereleases is set).
          case $version in *-*) tag=next ;; *) tag=latest ;; esac
          while read -r dir; do
            name=$(jq -r .name "$dir/package.json")
            status=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${name/\//%2f}/$version")
            case "$status" in
              200)
                echo "$name $version is already on npm; skipped"
                continue
                ;;
              404) ;;
              *)
                echo "npm answered HTTP $status for $name $version; not publishing" >&2
                exit 1
                ;;
            esac
            npm publish "$dir" --access public --provenance --tag "$tag"
          done < packages.txt
