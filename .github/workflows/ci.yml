# Checks for every pull request (and on demand). macOS runners bill 10x on a
# private repository, so only what needs APFS clones runs there; the rest runs
# on Linux. Not on pushes to master: a pull request already ran them.
name: ci
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        env:
          RUSTFLAGS: -D warnings
        run: cargo test --release
      # Right after cargo test, with the same RUSTFLAGS: the dependencies are
      # already compiled, so only matchapack itself is (seconds, not the
      # minutes a fresh container's build takes).
      - name: build
        env:
          RUSTFLAGS: -D warnings
        run: cargo build --release
      - name: shell routing in bash, zsh and fish (Docker, stubs)
        run: docker run --rm -v "$PWD":/src:ro debian:bookworm-slim bash /src/scripts/test-shells.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - name: fish with the real binary (npm ci and the yarn function, real npm and Yarn 1)
        # On the runner, not in a container: the binary built above, Yarn
        # 1.22.22 into a scratch prefix under RUNNER_TEMP.
        run: |
          sudo apt-get install -y -qq fish zsh >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq fish zsh >/dev/null; }
          MATCHAPACK_BIN=target/release/matchapack bash scripts/test-shells.sh --real

  macos:
    runs-on: macos-15
    # PR C1 added a classic store run and the workspaces cases.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          # npm 11.19.1: an npm major the inject engine (the default) runs
          # on, and a version in the classic engine's VERIFIED_NPM
          # (src/wrapper.rs).
          node-version: 24.22.1
      - name: build
        env:
          RUSTFLAGS: -D warnings
        run: cargo build --release
      # The classic engine's suites: test-safety.sh and test-wrapper.sh set
      # MATCHAPACK_ENGINE=classic themselves (they go with that engine, #33
      # PR C2).
      - name: safety tests (classic engine)
        run: scripts/test-safety.sh "$RUNNER_TEMP/safety"
      - name: routing tests (classic engine)
        run: scripts/test-wrapper.sh "$RUNNER_TEMP/wrapper"
      - name: store tests (records, gc, verify through npm's pacote, locks), default engine
        run: scripts/test-store.sh "$RUNNER_TEMP/store"
      - name: store tests, classic engine installs
        run: MATCHAPACK_ENGINE=classic scripts/test-store.sh "$RUNNER_TEMP/store-classic"
      - name: harness on the fixtures, classic engine (npm ci vs matchapack)
        # The same cases as the npm upgrade routine, which starts the tarball
        # server, requires byte-identical hidden lockfiles, and runs
        # script-env through the shell function, legacy-peer with
        # legacy-peer-deps and workspaces with --meta.
        run: MATCHAPACK_ENGINE=classic scripts/verify-npm.sh --no-record "$RUNNER_TEMP/v"
      - name: inject engine tests (hook rules, gates, npm's failures, lock, record, gid, workspaces flags)
        run: scripts/test-inject.sh "$RUNNER_TEMP/inject"
      - name: harness on the fixtures, inject engine (the default)
        # The same list plus the cases only this engine handles (dep-event,
        # optional-script-fail, per-file clones, odd-tarballs); every case
        # must have cloned.
        run: scripts/verify-npm.sh --no-record "$RUNNER_TEMP/vi"
      - name: fish, for the real yarn function (Homebrew comes with the runner)
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install fish && fish --version
      - name: Yarn 1 harness and engine (plain vs plain, diff --meta, matchapack yarn vs plain)
        # Yarn 1.22.22 into a scratch prefix, not the global npm; the
        # fixtures install from the local tarball server. The engine's
        # cross-Node case needs a second node (MATCHAPACK_YARN_PRIME_NODE)
        # and is skipped here; the two-volume case makes a disk image.
        # MATCHAPACK_FISH runs the route cases in fish with the real binary.
        run: |
          npm install --prefix "$RUNNER_TEMP/yarn1" --ignore-scripts --no-audit --no-fund yarn@1.22.22
          MATCHAPACK_FISH="$(command -v fish)" MATCHAPACK_YARN_JS="$RUNNER_TEMP/yarn1/node_modules/yarn/bin/yarn.js" scripts/test-yarn1.sh "$RUNNER_TEMP/y1"
