# Checks for every pull request (and on demand). While the repository was
# private, macOS runners billed 10x, so only what needs APFS clones runs
# there, on one npm; the rest runs on Linux, including the npm suites on
# each pinned npm line (linux-npm). Not on pushes to main: a pull request
# already ran them.
name: ci
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        env:
          RUSTFLAGS: -D warnings
        run: cargo test --release
      # Right after cargo test, with the same RUSTFLAGS: the dependencies are
      # already compiled, so only matchapack itself is (seconds, not the
      # minutes a fresh container's build takes).
      - name: build
        env:
          RUSTFLAGS: -D warnings
        run: cargo build --release
      - name: shell routing in bash, zsh and fish (Docker, stubs)
        run: docker run --rm -v "$PWD":/src:ro debian:bookworm-slim bash /src/scripts/test-shells.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - name: npm canary decisions (offline)
        run: node scripts/test-npm-canary.js
      - name: the benchmark script's own logic (offline)
        run: python3 -B scripts/test-bench.py
      - name: the npm package's launcher (stubs; sh is dash here)
        run: sh scripts/test-npm-launcher.sh
      - name: fish with the real binary (npm ci and the yarn function, real npm and Yarn 1)
        # On the runner, not in a container: the binary built above, Yarn
        # 1.22.22 into a scratch prefix under RUNNER_TEMP.
        run: |
          sudo apt-get install -y -qq fish zsh >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq fish zsh >/dev/null; }
          MATCHAPACK_BIN=target/release/matchapack bash scripts/test-shells.sh --real
      - name: hand-over to npm where nothing can be cloned (the runner's ext4; the store on another filesystem)
        # fixtures/small, `matchapack npm ci` against plain npm ci
        # (scripts/handover-test.sh): store and projects on ext4 (no
        # reflinks); then the store on a small loop-mounted btrfs and the
        # projects on ext4 (EXDEV), empty and then filled from a project on
        # that btrfs.
        env:
          npm_config_cache: ${{ runner.temp }}/handover/npm-cache
        run: |
          h=$RUNNER_TEMP/handover
          scripts/btrfs-scratch.sh "$h/btrfs" 2G
          echo "::group::store and projects on ext4"; s1=0; scripts/handover-test.sh "$h/ext4" "$h/ext4-store" || s1=$?; echo "::endgroup::"
          echo "::group::store on btrfs (empty), projects on ext4"; s2=0; scripts/handover-test.sh "$h/exdev" "$h/btrfs/store" || s2=$?; echo "::endgroup::"
          echo "::group::store on btrfs (filled there first), projects on ext4"; s3=0; scripts/handover-test.sh "$h/exdev-warm" "$h/btrfs/store-warm" "$h/btrfs/fill" || s3=$?; echo "::endgroup::"
          echo "ext4: $s1, EXDEV with an empty store: $s2, EXDEV with a filled store: $s3"
          [ "$s1$s2$s3" = 000 ]

  linux-npm:
    # The npm suites on Linux, one pinned npm per supported line, with the
    # work directories on a loop-mounted btrfs (so the hook really clones).
    # Pinned, never "the newest": a new npm must not turn an unrelated pull
    # request red; that is the npm canary's job (npm-canary.yml), whose green
    # rows say when to move these pins.
    name: linux-npm (npm ${{ matrix.npm }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        npm: [10.9.10, 11.21.2, 12.2.2]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - name: build
        env:
          RUSTFLAGS: -D warnings
        run: cargo build --release
      - name: btrfs on a loop device, zsh
        run: |
          sudo apt-get install -y -qq zsh >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq zsh >/dev/null; }
          scripts/btrfs-scratch.sh "$RUNNER_TEMP/btrfs"
      - name: inject engine tests and the fixture harness (test-inject.sh, verify-npm.sh)
        run: scripts/npm-suites.sh "${{ matrix.npm }}" "$RUNNER_TEMP/btrfs/w"
      - name: logs of a failed run
        if: failure()
        run: tail -n 40 "$RUNNER_TEMP"/btrfs/w/*.log || true

  macos:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A second Node major, for test-yarn1.sh's "cache filled by another
      # Node" case (MATCHAPACK_YARN_PRIME_NODE, #16): set up first, so that
      # the next setup-node puts 24 first on PATH.
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: remember the second Node
        run: echo "MATCHAPACK_YARN_PRIME_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          # npm 11.19.1: an npm major the inject engine runs on
          # (INJECT_NPM_MAJORS, src/wrapper.rs). One npm on macOS: the other
          # lines run on Linux (linux-npm); macOS bills 10x.
          node-version: 24.22.1
      - name: build
        env:
          RUSTFLAGS: -D warnings
        run: cargo build --release
      - name: safety tests (tampered lockfiles, symlinked directories, against plain npm ci)
        run: scripts/test-safety.sh "$RUNNER_TEMP/safety"
      - name: routing tests (the shell function and `matchapack npm`)
        run: scripts/test-wrapper.sh "$RUNNER_TEMP/wrapper"
      - name: store tests (records, gc, verify through npm's pacote, locks)
        run: scripts/test-store.sh "$RUNNER_TEMP/store"
      - name: inject engine tests (hook rules, gates, npm's failures, lock, record, gid, workspaces flags)
        run: scripts/test-inject.sh "$RUNNER_TEMP/inject"
      - name: harness on the fixtures (npm ci vs matchapack)
        # The npm upgrade routine: starts the tarball server, requires
        # byte-identical hidden lockfiles, runs script-env through the shell
        # function, legacy-peer with legacy-peer-deps and workspaces with
        # --meta; every case must have cloned.
        run: scripts/verify-npm.sh --no-record "$RUNNER_TEMP/vi"
      - name: fish, for the real yarn function (Homebrew comes with the runner)
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install fish && fish --version
      - name: Yarn 1 harness and engine (plain vs plain, diff --meta, matchapack yarn vs plain)
        # Yarn 1.22.22 into a scratch prefix, not the global npm; the
        # fixtures install from the local tarball server. The engine's
        # cross-Node case fills the cache with Node 22
        # (MATCHAPACK_YARN_PRIME_NODE, set above); the two-volume case makes
        # a disk image.
        # MATCHAPACK_FISH runs the route cases in fish with the real binary.
        run: |
          npm install --prefix "$RUNNER_TEMP/yarn1" --ignore-scripts --no-audit --no-fund yarn@1.22.22
          MATCHAPACK_FISH="$(command -v fish)" MATCHAPACK_YARN_JS="$RUNNER_TEMP/yarn1/node_modules/yarn/bin/yarn.js" scripts/test-yarn1.sh "$RUNNER_TEMP/y1"
