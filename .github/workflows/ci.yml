# Checks for every pull request (and on demand). macOS runners bill 10x on a
# private repository, so only what needs APFS clones runs there; the rest runs
# on Linux. Not on pushes to master: a pull request already ran them.
name: ci
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        env:
          RUSTFLAGS: -D warnings
        run: cargo test --release
      - name: shell routing in bash, zsh and fish (Docker)
        run: docker run --rm -v "$PWD":/src:ro debian:bookworm-slim bash /src/scripts/test-shells.sh

  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          # npm 11.19.1, a version in VERIFIED_NPM (src/wrapper.rs).
          node-version: 24.22.1
      - name: build
        env:
          RUSTFLAGS: -D warnings
        run: cargo build --release
      - name: safety tests
        run: scripts/test-safety.sh "$RUNNER_TEMP/safety"
      - name: routing tests
        run: scripts/test-wrapper.sh "$RUNNER_TEMP/wrapper"
      - name: store tests (records, gc, verify, locks)
        run: scripts/test-store.sh "$RUNNER_TEMP/store"
      - name: harness on the fixtures (npm ci vs matchapack)
        # The same cases as the npm upgrade routine, which starts the tarball
        # server, requires byte-identical hidden lockfiles, and runs
        # script-env through the shell function and legacy-peer with
        # legacy-peer-deps.
        run: scripts/verify-npm.sh --no-record "$RUNNER_TEMP/v"
      - name: inject engine tests (hook rules, gates, npm's failures, lock, record)
        run: scripts/test-inject.sh "$RUNNER_TEMP/inject"
      - name: harness on the fixtures, inject engine
        # The same list plus the cases only this engine handles (dep-event,
        # optional-script-fail, per-file clones, odd-tarballs); every case
        # must have cloned.
        run: MATCHAPACK_ENGINE=inject scripts/verify-npm.sh --no-record "$RUNNER_TEMP/vi"
